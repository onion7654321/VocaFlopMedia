name: Build desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, platform: Windows-x64}
          - {os: ubuntu-22.04, platform: Linux-x64}
          - {os: macos-15-intel, platform: macOS-Intel}
          - {os: macos-15, platform: macOS-ARM64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libmpv1 libsecret-1-0 ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Build Windows
        if: runner.os == 'Windows'
        run: flet pack main.py --name Vocaflop --icon assets/logo.ico --onedir --yes
      - name: Build Linux
        if: runner.os == 'Linux'
        run: flet pack main.py --name Vocaflop --onedir --yes
      - name: Build macOS
        if: runner.os == 'macOS'
        run: flet pack main.py --name Vocaflop --onedir --yes
      - name: Package Windows
        if: runner.os == 'Windows'
        run: python scripts/package_release.py
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          test -x dist/Vocaflop/Vocaflop
          tar -czf release/Vocaflop-Linux-x64.tar.gz -C dist Vocaflop
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          test -d dist/Vocaflop.app
          ditto -c -k --sequesterRsrc --keepParent dist/Vocaflop.app release/Vocaflop-${{ matrix.platform }}.zip
      - name: Checksums
        run: python scripts/release_checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: Vocaflop-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
