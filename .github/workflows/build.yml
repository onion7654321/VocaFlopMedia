
name: Build Vocaflop

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows-x64

          - os: ubuntu-22.04
            platform: Linux-x64

          - os: macos-15-intel
            platform: macOS-Intel

          - os: macos-15
            platform: macOS-ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libmpv1 libsecret-1-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -q

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          flet pack main.py --name Vocaflop --icon assets/logo.ico --onedir --yes

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          flet pack main.py --name Vocaflop --icon assets/logo.png --yes

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          flet pack main.py --name Vocaflop --yes

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Vocaflop -DestinationPath Vocaflop-${{ matrix.platform }}.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          tar -czf Vocaflop-${{ matrix.platform }}.tar.gz -C dist .

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Vocaflop.app Vocaflop-${{ matrix.platform }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vocaflop-${{ matrix.platform }}
          path: |
            Vocaflop-*.zip
            Vocaflop-*.tar.gz
          if-no-files-found: error
